[project]
name = "detkit"
version = "0.1.0"
description = "Small toolkit: tile photos, review boxes, build a COCO split, train a small RF-DETR, run tiled inference, and estimate grain weight. A trimmed, use-case-specific subset of vision-intern."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow",
    "numpy",
    "requests",
    "tqdm",
]

[project.optional-dependencies]
# Non-torch training/inference deps. Do not install alone: pick `cpu` or `gpu` (which add torch).
train-core = [
    "transformers==5.12.1",   # newer releases dropped TrainingArguments.warmup_ratio used by the vendored trainer
    "timm",
    "torchmetrics==1.9.0",
    "albumentations",
    "accelerate",
    "pycocotools",
    "scipy",
    "einops",
    "datasets",
]
# torch build is chosen by extra (see [tool.uv.sources]); they are mutually exclusive.
cpu = ["detkit[train-core]", "torch==2.12.1", "torchvision==0.27.1"]
gpu = ["detkit[train-core]", "torch==2.12.1", "torchvision==0.27.1"]   # cu126: runs on driver 535 / Pascal
# Gradio annotation app + Excel/plots for the analysis workbook.
app = ["gradio>=5", "gradio_image_annotation>=0.5.6", "pandas", "openpyxl", "matplotlib"]
dev = ["pytest>=8.0"]
# Interactive stats notebooks in ppt_slide_topics/.
notebook = ["numpy", "scipy", "matplotlib", "ipywidgets", "jupyterlab"]

[project.scripts]
detkit = "detkit.cli:main"

[tool.uv]
package = false

conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
